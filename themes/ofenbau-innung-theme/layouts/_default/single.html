<!DOCTYPE html>
<html lang="de">
  {{ partial "head.html" . }}
  <body>
    {{ partial "header.html" . }}
    <main>
      <header class="page-header">
        <h1>{{ .Title }}</h1>
      </header>

      {{ if .Content }}
      <div class="article-body">{{ .Content }}</div>
      {{ end }}

      {{ partial "gallery.html" . }}
    </main>
    {{ partial "footer.html" . }}
  </body>
</html>

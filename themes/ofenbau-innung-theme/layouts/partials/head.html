<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    {{- if .IsHome -}}
    {{ .Site.Title }}
    {{- else -}}
    {{ .Title }} | {{ .Site.Title }}
    {{- end -}}
  </title>
  <meta name="description"
        content="{{ if .IsHome }}Innung des Kachelofen- und Kaminbauerhandwerks Land Brandenburg – Ihr Fachverband für Kaminbau, Kachelöfen und Heizkamine.{{ else }}{{ .Summary | plainify }}{{ end }}">
  <link rel="stylesheet" href="{{ "css/main.css" | absURL }}">
  <script src="{{ "js/custom.js" | absURL }}" defer></script>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  {{ hugo.Generator }}
</head>

<!DOCTYPE html>
<html lang="de">
  {{ partial "head.html" . }}
  <body>
    {{ partial "header.html" . }}
    <main>
      <header class="page-header">
        <h1>{{ .Title }}</h1>
      </header>
      {{ if .Content }}
      <div class="section-intro article-body">{{ .Content }}</div>
      {{ end }}

      {{ with .Pages }}
      <nav class="section-children" aria-label="Unterbereiche">
        {{ range . }}
        <a class="section-child-link" href="{{ .Permalink }}">{{ .Title }}</a>
        {{ end }}
      </nav>
      {{ end }}

      {{ partial "gallery.html" . }}
      {{ partial "section-gallery.html" . }}
    </main>
    {{ partial "footer.html" . }}
  </body>
</html>
